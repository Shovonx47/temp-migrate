        example: FROLAX
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      numbers:
        custom: []
        name: numbers
        description: 'One or more E.164 phone numbers. Array or delimited string.'
        required: true
